<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ contest.name }} - Exam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- ACE Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.4/ace.js"></script>
    <!-- MathJax for LaTeX rendering -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)'], ['~', '~']],
                displayMath: [['\\[', '\\]'], ['$$', '$$']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-chtml.min.js"></script>
    <style>
        :root {
            --hpe-green: #01a982;
            --header-height: 60px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            overflow: hidden;
        }

        /* --- Header --- */
        .top-bar {
            height: var(--header-height);
            background: #2d2d2d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #404040;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
        }

        .logo-box {
            background: var(--hpe-green);
            color: white;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            margin-right: 12px;
            font-weight: 900;
            font-size: 14px;
        }

        .timer-area {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        /* --- Main Layout --- */
        .main-container {
            display: flex;
            height: calc(100vh - var(--header-height));
            margin-top: var(--header-height);
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 50px;
            background: #252526;
            border-right: 1px solid #404040;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            flex-shrink: 0;
        }

        .side-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #858585;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .side-btn.active {
            color: var(--hpe-green);
            background: rgba(1, 169, 130, 0.15);
        }

        .side-btn:hover {
            background: #3c3c3c;
            color: #fff;
        }

        /* --- Content Area --- */
        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- Dashboard View --- */
        .dashboard-view {
            padding: 30px 40px;
            overflow-y: auto;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .dashboard-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 25px;
            color: #fff;
        }

        .question-card {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 18px 24px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #404040;
            transition: all 0.2s;
        }

        .question-card:hover {
            border-color: var(--hpe-green);
            background: #333;
        }

        .q-info {
            flex-grow: 1;
        }

        .q-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
            color: #fff;
        }

        .q-meta {
            font-size: 13px;
            color: #888;
        }

        .solve-btn {
            background: var(--hpe-green);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .solve-btn:hover {
            background: #00bf96;
        }

        .submit-test-container {
            margin-top: 30px;
            text-align: center;
        }

        .submit-test-btn {
            background: transparent;
            border: 2px solid var(--hpe-green);
            color: var(--hpe-green);
            padding: 12px 40px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .submit-test-btn:hover {
            background: var(--hpe-green);
            color: #fff;
        }

        /* --- Problem Editor View --- */
        .editor-view {
            display: none;
            flex: 1;
            flex-direction: row;
            height: 100%;
        }

        .editor-view.active {
            display: flex;
        }

        /* Left Panel - Problem */
        .problem-panel {
            width: 45%;
            background: #1e1e1e;
            border-right: 1px solid #404040;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .problem-header {
            padding: 15px 20px;
            border-bottom: 1px solid #404040;
            background: #252526;
        }

        .problem-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .problem-meta {
            font-size: 12px;
            color: #888;
            display: flex;
            gap: 20px;
        }

        .problem-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            line-height: 1.8;
            font-size: 14px;
            color: #e0e0e0;
        }

        /* Markdown Heading Styles */
        .problem-content h1,
        .problem-content h2,
        .problem-content h3,
        .problem-content h4 {
            color: #fff;
            margin-top: 24px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .problem-content h1 {
            font-size: 20px;
            border-bottom: 1px solid #404040;
            padding-bottom: 8px;
        }

        .problem-content h2 {
            font-size: 17px;
            color: var(--hpe-green);
        }

        .problem-content h3 {
            font-size: 15px;
        }

        .problem-content h4 {
            font-size: 14px;
            color: #bbb;
        }

        /* Paragraph and text */
        .problem-content p {
            margin-bottom: 14px;
        }

        /* Code and pre blocks */
        .problem-content pre {
            background: #2d2d2d;
            padding: 14px;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid #404040;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.5;
            margin: 12px 0;
        }

        .problem-content code {
            background: #3c3c3c;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
        }

        .problem-content pre code {
            background: none;
            padding: 0;
        }

        /* Sample I/O styling */
        .problem-content .sample-input,
        .problem-content .sample-output {
            background: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }

        /* Lists */
        .problem-content ul,
        .problem-content ol {
            padding-left: 24px;
            margin-bottom: 14px;
        }

        .problem-content li {
            margin-bottom: 6px;
        }

        /* Math (LaTeX) styling */
        .problem-content .math,
        .problem-content .katex {
            color: #f0f0f0;
        }

        /* Blockquotes */
        .problem-content blockquote {
            border-left: 3px solid var(--hpe-green);
            margin: 12px 0;
            padding-left: 16px;
            color: #bbb;
        }

        /* Tables */
        .problem-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0;
        }

        .problem-content th,
        .problem-content td {
            border: 1px solid #404040;
            padding: 8px 12px;
            text-align: left;
        }

        .problem-content th {
            background: #2d2d2d;
            color: #fff;
        }

        /* Right Panel - Code */
        .code-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
        }

        .code-header {
            padding: 10px 15px;
            background: #252526;
            border-bottom: 1px solid #404040;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .code-header select {
            background: #3c3c3c;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
        }

        .code-editor-container {
            flex: 1;
            position: relative;
        }

        #ace-editor {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .code-footer {
            padding: 10px 15px;
            background: #252526;
            border-top: 1px solid #404040;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            border: none;
            transition: all 0.2s;
        }

        .btn-back {
            background: #404040;
            color: #fff;
        }

        .btn-back:hover {
            background: #555;
        }

        .btn-run {
            background: #3794ff;
            color: #fff;
        }

        .btn-run:hover {
            background: #2080e5;
        }

        .btn-test {
            background: #ff9800;
            color: #fff;
        }

        .btn-test:hover {
            background: #e68900;
        }

        .btn-submit {
            background: var(--hpe-green);
            color: #fff;
        }

        .btn-submit:hover {
            background: #00bf96;
        }

        /* Results Panel */
        .results-panel {
            background: #252526;
            border-top: 1px solid #404040;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .results-panel.open {
            max-height: 250px;
        }

        .results-header {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #404040;
        }

        .results-header h4 {
            margin: 0;
            font-size: 14px;
        }

        .results-content {
            padding: 15px;
            overflow-y: auto;
            max-height: 200px;
        }

        .result-item {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .result-item.pass {
            background: rgba(76, 175, 80, 0.15);
            border-left: 3px solid #4caf50;
        }

        .result-item.fail {
            background: rgba(244, 67, 54, 0.15);
            border-left: 3px solid #f44336;
        }

        .result-item.pending {
            background: rgba(255, 152, 0, 0.15);
            border-left: 3px solid #ff9800;
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #555;
            border-top: 2px solid var(--hpe-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Proctoring Status */
        .proctor-status {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .proctor-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff00;
        }

        .proctor-status video {
            width: 60px;
            height: 45px;
            border-radius: 4px;
            opacity: 0.7;
        }

        /* Resize Handle */
        .resize-handle {
            width: 4px;
            background: #404040;
            cursor: col-resize;
            flex-shrink: 0;
        }

        .resize-handle:hover {
            background: var(--hpe-green);
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="top-bar">
        <div class="logo-area">
            <div class="logo-box">H</div>
            <span>{{ contest.name }}</span>
        </div>
        <div class="timer-area">
            <i class="fa fa-clock-o"></i>&nbsp;&nbsp;<span id="countdown">Loading...</span>
        </div>
        <div class="user-menu">
            <span>{{ request.user.username }}</span>
        </div>
    </div>

    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="side-btn active" id="btn-dashboard" onclick="showDashboard()">
                <i class="fa fa-list-ul"></i>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Dashboard View -->
            <div class="dashboard-view" id="dashboard-view">
                <div class="dashboard-title">Problems</div>

                {% for cp in contest.contest_problems.all() %}
                <div class="question-card" data-code="{{ cp.problem.code }}">
                    <div class="q-info">
                        <div class="q-title">{{ loop.index }}. {{ cp.problem.name }}</div>
                        <div class="q-meta">{{ cp.points }} points • Time: {{ cp.problem.time_limit }}s</div>
                    </div>
                    <button class="solve-btn" onclick="loadProblem('{{ cp.problem.code }}')">Solve</button>
                </div>
                {% endfor %}

                <div class="submit-test-container">
                    <button class="submit-test-btn" onclick="confirmSubmit()">
                        <i class="fa fa-check-circle"></i>&nbsp; Submit Test
                    </button>
                </div>
            </div>

            <!-- Editor View (hidden by default) -->
            <div class="editor-view" id="editor-view">
                <!-- Left Panel - Problem -->
                <div class="problem-panel" id="problem-panel">
                    <div class="problem-header">
                        <div class="problem-title" id="problem-title">Loading...</div>
                        <div class="problem-meta">
                            <span id="problem-points"></span>
                            <span id="problem-limits"></span>
                        </div>
                    </div>
                    <div class="problem-content" id="problem-content">
                        <p>Loading problem description...</p>
                    </div>
                </div>

                <!-- Resize Handle -->
                <div class="resize-handle" id="resize-handle"></div>

                <!-- Right Panel - Code -->
                <div class="code-panel">
                    <div class="code-header">
                        <select id="language-select"></select>
                        <span id="problem-nav" style="margin-left: auto; font-size: 12px; color: #888;"></span>
                    </div>
                    <div class="code-editor-container">
                        <div id="ace-editor"></div>
                    </div>

                    <!-- Results Panel -->
                    <div class="results-panel" id="results-panel">
                        <div class="results-header">
                            <h4>Results</h4>
                            <button onclick="toggleResults()"
                                style="background:none;border:none;color:#888;cursor:pointer;">
                                <i class="fa fa-times"></i>
                            </button>
                        </div>
                        <div class="results-content" id="results-content">
                        </div>
                    </div>

                    <div class="code-footer">
                        <button class="btn btn-back" onclick="showDashboard()">
                            <i class="fa fa-arrow-left"></i>&nbsp; Back
                        </button>
                        <div class="btn-group">
                            <button class="btn btn-run" id="btn-run" onclick="runCode()">
                                <i class="fa fa-play"></i>&nbsp; Run Code
                            </button>
                            <button class="btn btn-test" id="btn-test" onclick="runTest()">
                                <i class="fa fa-check-square-o"></i>&nbsp; Run Test
                            </button>
                            <button class="btn btn-submit" id="btn-submit" onclick="submitCode()">
                                <i class="fa fa-paper-plane"></i>&nbsp; Submit
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Proctoring elements (hidden - runs in background) -->
    <video id="webcam" autoplay muted playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // ========== CONFIG ==========
        const CONTEST_KEY = "{{ contest.key }}";
        const USER_ID = "{{ request.user.id }}";
        const SESSION_ID = "hpe_" + USER_ID + "_" + Date.now();
        const WS_URL = "ws://127.0.0.1:8001/ws?session_id=" + SESSION_ID;

        // Problem navigation
        const PROBLEM_CODES = [{% for cp in contest.contest_problems.all() %}"{{ cp.problem.code }}"{% if not loop.last %}, {% endif %} {% endfor %}];
        let currentProblemCode = null;
        let currentProblemIndex = -1;

        // ACE Editor
        let editor = null;

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', function () {
            // Init ACE
            editor = ace.edit("ace-editor");
            editor.setTheme("ace/theme/monokai");
            editor.session.setMode("ace/mode/python");
            editor.setOptions({
                fontSize: "14px",
                showPrintMargin: false,
                highlightActiveLine: true
            });

            // Init proctoring
            initProctoring();

            // Init timer
            initTimer();

            // Init resize handle
            initResize();
        });

        // ========== NAVIGATION ==========
        function showDashboard() {
            document.getElementById('dashboard-view').style.display = 'block';
            document.getElementById('editor-view').classList.remove('active');
            document.getElementById('btn-dashboard').classList.add('active');
            currentProblemCode = null;
            currentProblemIndex = -1;
        }

        async function loadProblem(problemCode) {
            currentProblemCode = problemCode;
            currentProblemIndex = PROBLEM_CODES.indexOf(problemCode);

            // Show editor view
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('editor-view').classList.add('active');
            document.getElementById('btn-dashboard').classList.remove('active');

            // Show loading
            document.getElementById('problem-title').textContent = 'Loading...';
            document.getElementById('problem-content').innerHTML = '<p style="text-align:center;padding:40px;"><span class="spinner"></span> Loading...</p>';

            try {
                const response = await fetch(`/hpe/contest/${CONTEST_KEY}/problem/${problemCode}/content/`);
                if (!response.ok) throw new Error('Failed to load problem');

                const data = await response.json();

                // Update problem info
                document.getElementById('problem-title').textContent = data.name;
                document.getElementById('problem-points').textContent = data.points + ' points' + (data.partial ? ' (partial)' : '');
                document.getElementById('problem-limits').textContent = 'Time: ' + data.time_limit + 's • Memory: ' + (data.memory_limit / 1024).toFixed(0) + 'MB';
                document.getElementById('problem-content').innerHTML = data.description_html;
                document.getElementById('problem-nav').textContent = 'Problem ' + (data.current_index + 1) + ' of ' + data.total_problems;

                // Trigger MathJax to render LaTeX math expressions
                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise([document.getElementById('problem-content')]).catch(function (err) {
                        console.log('MathJax typeset error:', err);
                    });
                }

                // Update language selector
                const langSelect = document.getElementById('language-select');
                langSelect.innerHTML = '';
                data.languages.forEach((lang, idx) => {
                    const opt = document.createElement('option');
                    opt.value = lang.id;
                    opt.textContent = lang.name;
                    opt.dataset.aceMode = lang.ace_mode;
                    opt.dataset.template = lang.template;
                    if (idx === 0) opt.selected = true;
                    langSelect.appendChild(opt);
                });

                // Set editor mode and template
                if (data.languages.length > 0) {
                    const firstLang = data.languages[0];
                    editor.session.setMode('ace/mode/' + firstLang.ace_mode);
                    editor.setValue(firstLang.template || '', -1);
                }

                // Language change handler
                langSelect.onchange = function () {
                    const opt = this.options[this.selectedIndex];
                    editor.session.setMode('ace/mode/' + opt.dataset.aceMode);
                    if (opt.dataset.template) {
                        editor.setValue(opt.dataset.template, -1);
                    }
                };

                // Hide results
                toggleResults(false);

            } catch (err) {
                document.getElementById('problem-content').innerHTML = '<p style="color:#f44336;">Error: ' + err.message + '</p>';
            }
        }

        function confirmSubmit() {
            if (confirm("Are you sure you want to finish the test?")) {
                window.location.href = "/";
            }
        }

        // ========== CODE SUBMISSION ==========
        // MODES: 'sample' = show only sample tests, 'test' = all tests non-official, 'submit' = official + navigate

        async function runCode() {
            // Run on sample test cases only (show first 2-3 test results)
            await submitCodeInternal('sample');
        }

        async function runTest() {
            // Run all test cases but not official submission
            await submitCodeInternal('test');
        }

        async function submitCode() {
            // Official submission - evaluates and navigates to next problem
            await submitCodeInternal('submit');
        }

        async function submitCodeInternal(mode) {
            const source = editor.getValue();
            const langId = document.getElementById('language-select').value;

            if (!source.trim()) {
                alert('Please write some code first!');
                return;
            }

            // Show loading message based on mode
            let loadingMessage = 'Running...';
            if (mode === 'test') loadingMessage = 'Running all tests...';
            if (mode === 'submit') loadingMessage = 'Submitting...';

            showResults('<div class="result-item pending"><span class="spinner"></span> ' + loadingMessage + '</div>');

            try {
                // Use DMOJ's native submission endpoint with FormData
                const formData = new FormData();
                formData.append('language', langId);
                formData.append('source', source);

                const response = await fetch(`/problem/${currentProblemCode}/submit`, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    credentials: 'same-origin'
                });

                if (!response.ok) {
                    if (response.status === 429) {
                        throw new Error('Too many submissions. Please wait a moment.');
                    }
                    throw new Error('Server error: ' + response.status);
                }

                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    console.error('Non-JSON response:', text);
                    throw new Error('Invalid response. Please check if you are logged in.');
                }

                const data = await response.json();

                if (data.error) {
                    showResults('<div class="result-item fail">' + data.error + '</div>');
                    return;
                }

                if (data.submission) {
                    // Poll for results using DMOJ's native status endpoint
                    pollSubmissionStatus(data.submission, mode);
                } else {
                    showResults('<div class="result-item fail">Submission failed</div>');
                }

            } catch (err) {
                showResults('<div class="result-item fail">Error: ' + err.message + '</div>');
            }
        }

        async function pollSubmissionStatus(submissionId, mode) {
            let attempts = 0;
            const maxAttempts = 60;

            const poll = async () => {
                try {
                    // Use DMOJ's native submission status endpoint
                    const response = await fetch(`/ajax/submission_status/?id=${submissionId}`);
                    const data = await response.json();

                    if (data.error) {
                        showResults('<div class="result-item fail">' + data.error + '</div>');
                        return;
                    }

                    // Update results display
                    let html = '';

                    if (!data.is_graded) {
                        html = '<div class="result-item pending"><span class="spinner"></span> Judging... (' + (data.status_display || data.status) + ')</div>';
                    } else {
                        // Show final results
                        const isAC = data.status === 'AC';
                        html = '<div class="result-item ' + (isAC ? 'pass' : 'fail') + '">';
                        html += '<strong>' + (data.status_display || data.status) + '</strong>';
                        if (data.points !== null && data.points !== undefined) {
                            html += ' • ' + data.points + ' points';
                        }
                        if (data.time) {
                            // Format time nicely
                            const timeVal = parseFloat(data.time);
                            html += ' • ' + (isNaN(timeVal) ? data.time : timeVal.toFixed(3) + 's');
                        }
                        if (data.memory) {
                            // Format memory nicely
                            const memVal = parseFloat(data.memory);
                            html += ' • ' + (isNaN(memVal) ? data.memory : Math.round(memVal) + 'KB');
                        }
                        html += '</div>';

                        // Show test cases based on mode
                        if (data.test_cases && data.test_cases.length > 0) {
                            // For 'sample' mode, only show first 2 test cases
                            const maxCases = (mode === 'sample') ? 2 : data.test_cases.length;
                            const casesToShow = data.test_cases.slice(0, maxCases);

                            casesToShow.forEach((tc, idx) => {
                                const isPass = tc.status === 'AC';
                                html += '<div class="result-item ' + (isPass ? 'pass' : 'fail') + '">';
                                html += 'Test ' + (idx + 1) + ': ' + tc.status;
                                if (tc.time) {
                                    const tcTime = parseFloat(tc.time);
                                    html += ' • ' + (isNaN(tcTime) ? tc.time : tcTime.toFixed(3) + 's');
                                }
                                html += '</div>';
                            });

                            // Show "and X more..." for sample mode
                            if (mode === 'sample' && data.test_cases.length > 2) {
                                html += '<div class="result-item" style="color:#888;">... and ' + (data.test_cases.length - 2) + ' more test cases</div>';
                            }
                        }

                        // Auto-navigate only on SUBMIT mode with AC
                        if (mode === 'submit' && isAC) {
                            const nextIdx = currentProblemIndex + 1;
                            if (nextIdx < PROBLEM_CODES.length) {
                                html += '<div class="result-item pass" style="margin-top:10px;">✓ Correct! Loading next problem...</div>';
                                setTimeout(() => loadProblem(PROBLEM_CODES[nextIdx]), 1500);
                            } else {
                                html += '<div class="result-item pass" style="margin-top:10px;">✓ All problems completed!</div>';
                                setTimeout(() => showDashboard(), 1500);
                            }
                        }
                    }

                    showResults(html);

                    // Continue polling if not graded
                    if (!data.is_graded && attempts < maxAttempts) {
                        attempts++;
                        setTimeout(poll, 1000);
                    }

                } catch (err) {
                    showResults('<div class="result-item fail">Polling error: ' + err.message + '</div>');
                }
            };

            poll();
        }

        function showResults(html) {
            document.getElementById('results-content').innerHTML = html;
            document.getElementById('results-panel').classList.add('open');
        }

        function toggleResults(show) {
            const panel = document.getElementById('results-panel');
            if (show === false) {
                panel.classList.remove('open');
            } else if (show === true) {
                panel.classList.add('open');
            } else {
                panel.classList.toggle('open');
            }
        }

        // ========== TIMER ==========
        function initTimer() {
            const endTime = new Date("{{ contest.end_time.isoformat() }}");

            function updateTimer() {
                const now = new Date();
                const diff = endTime - now;

                if (diff <= 0) {
                    document.getElementById('countdown').textContent = 'Time Up!';
                    return;
                }

                const hours = Math.floor(diff / 3600000);
                const mins = Math.floor((diff % 3600000) / 60000);
                const secs = Math.floor((diff % 60000) / 1000);

                document.getElementById('countdown').textContent =
                    String(hours).padStart(2, '0') + ':' +
                    String(mins).padStart(2, '0') + ':' +
                    String(secs).padStart(2, '0');
            }

            updateTimer();
            setInterval(updateTimer, 1000);
        }

        // ========== RESIZE ==========
        function initResize() {
            const handle = document.getElementById('resize-handle');
            const problemPanel = document.getElementById('problem-panel');
            let isResizing = false;

            handle.addEventListener('mousedown', (e) => {
                isResizing = true;
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const editorView = document.getElementById('editor-view');
                const rect = editorView.getBoundingClientRect();
                const newWidth = ((e.clientX - rect.left) / rect.width) * 100;
                if (newWidth >= 25 && newWidth <= 75) {
                    problemPanel.style.width = newWidth + '%';
                }
            });

            document.addEventListener('mouseup', () => {
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                if (editor) editor.resize();
            });
        }

        // ========== PROCTORING ==========
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        let socket;
        let isConnected = false;
        const frameBuffer = [];
        const MAX_BUFFER_SIZE = 50;

        async function initProctoring() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
                video.srcObject = stream;
                initWebSocket();
                setInterval(captureAndSendFrame, 1000);
            } catch (err) {
                console.error("Proctoring init failed:", err);
                statusText.innerText = "Camera Error";
                statusDot.style.background = "red";
            }
        }

        function initWebSocket() {
            socket = new WebSocket(WS_URL);
            socket.onopen = () => {
                isConnected = true;
                statusText.innerText = "Active";
                statusDot.style.background = "#00ff00";
                flushBuffer();
            };
            socket.onclose = () => {
                isConnected = false;
                statusText.innerText = "Reconnecting...";
                statusDot.style.background = "orange";
                setTimeout(initWebSocket, 3000);
            };
            socket.onerror = () => socket.close();
        }

        function captureAndSendFrame() {
            if (video.readyState !== 4) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob((blob) => {
                if (isConnected && socket.readyState === WebSocket.OPEN) {
                    socket.send(blob);
                } else if (frameBuffer.length < MAX_BUFFER_SIZE) {
                    frameBuffer.push(blob);
                }
            }, 'image/jpeg', 0.5);
        }

        function flushBuffer() {
            while (frameBuffer.length > 0 && isConnected) {
                socket.send(frameBuffer.shift());
            }
        }

        // Violation tracking
        let tabSwitchCount = 0;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                tabSwitchCount++;
                if (isConnected && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: "tab_switch", count: tabSwitchCount, time_outside: 0 }));
                }
            }
        });

        // ========== UTILS ==========
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
