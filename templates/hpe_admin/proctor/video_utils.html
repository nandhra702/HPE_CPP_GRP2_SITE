<script>
    (function () {
        "use strict";

        // Debug flag - set to false in production
        const DEBUG = true;

        function log(...args) {
            if (DEBUG) console.log("[HPE-VIDEO]", ...args);
        }

        function warn(...args) {
            console.warn("[HPE-VIDEO]", ...args);
        }

        function error(...args) {
            console.error("[HPE-VIDEO]", ...args);
        }

        log("Module loading...");

        /**
         * Fix WebM duration metadata
         * Chrome's MediaRecorder creates "live" WebM without Duration element.
         * This function patches existing Duration OR injects one if missing.
         */
        async function fixWebmDuration(blob, durationMs) {
            if (!blob || blob.size === 0 || durationMs <= 0) return blob;

            try {
                const buffer = await blob.arrayBuffer();
                const bytes = new Uint8Array(buffer);
                const maxSearch = Math.min(500, bytes.length);

                // First, try to find and patch existing Duration element (0x44 0x89)
                for (let i = 0; i < maxSearch; i++) {
                    if (bytes[i] === 0x44 && bytes[i + 1] === 0x89) {
                        const sizeIndicator = bytes[i + 2];
                        const view = new DataView(buffer);

                        if (sizeIndicator === 0x88) {
                            view.setFloat64(i + 3, durationMs, false);
                            log(`📼 Fixed WebM duration: ${(durationMs / 1000).toFixed(1)}s at byte ${i}`);
                            return new Blob([buffer], { type: blob.type });
                        } else if (sizeIndicator === 0x84) {
                            view.setFloat32(i + 3, durationMs, false);
                            log(`📼 Fixed WebM duration (32-bit): ${(durationMs / 1000).toFixed(1)}s`);
                            return new Blob([buffer], { type: blob.type });
                        }
                    }
                }

                // Duration not found - inject after TimecodeScale (0x2A 0xD7 0xB1)
                for (let i = 0; i < maxSearch; i++) {
                    if (bytes[i] === 0x2A && bytes[i + 1] === 0xD7 && bytes[i + 2] === 0xB1) {
                        // Skip TimecodeScale element ID (3 bytes) + size (1 byte) + data
                        const tcSize = bytes[i + 3] & 0x7F;
                        const insertPos = i + 4 + tcSize;

                        // Create Duration element: ID(2) + Size(1) + float64(8) = 11 bytes
                        const durationBytes = new Uint8Array(11);
                        durationBytes[0] = 0x44; // Duration ID high
                        durationBytes[1] = 0x89; // Duration ID low  
                        durationBytes[2] = 0x88; // Size: 8 bytes
                        new DataView(durationBytes.buffer).setFloat64(3, durationMs, false);

                        // Build new buffer with injected Duration
                        const newBuffer = new Uint8Array(bytes.length + 11);
                        newBuffer.set(bytes.subarray(0, insertPos));
                        newBuffer.set(durationBytes, insertPos);
                        newBuffer.set(bytes.subarray(insertPos), insertPos + 11);

                        log(`📼 Injected WebM duration: ${(durationMs / 1000).toFixed(1)}s at byte ${insertPos}`);
                        return new Blob([newBuffer], { type: blob.type });
                    }
                }

                log("ℹ️ Could not fix WebM duration - video may show incorrect length");
                return blob;
            } catch (err) {
                error("Failed to fix WebM duration:", err);
                return blob;
            }
        }

        /**
         * Phase 5: IndexedDB Persistence for Failed Uploads
         * Stores failed video uploads locally for background retry
         */
        class HPEUploadPersistence {
            constructor() {
                this.dbName = 'HPEProctoringEvidence';
                this.storeName = 'pendingUploads';
                this.db = null;
                this.isAvailable = false;
                this.maxRetries = 10;
                this.retryIntervalMs = 5 * 60 * 1000; // 5 minutes
                this.maxStorageMB = 500; // 500MB quota
                this._retryWorker = null;

                // Check IndexedDB availability
                if (!window.indexedDB) {
                    warn("IndexedDB not available - upload persistence disabled");
                    return;
                }

                this._initDB();
            }

            async _initDB() {
                try {
                    const request = indexedDB.open(this.dbName, 1);

                    request.onerror = (event) => {
                        warn("IndexedDB open failed:", event.target.error);
                        this.isAvailable = false;
                    };

                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;

                        if (!db.objectStoreNames.contains(this.storeName)) {
                            const store = db.createObjectStore(this.storeName, {
                                keyPath: 'id',
                                autoIncrement: true
                            });

                            store.createIndex('timestamp', 'timestamp', { unique: false });
                            store.createIndex('status', 'status', { unique: false });
                            log("IndexedDB store created:", this.storeName);
                        }
                    };

                    request.onsuccess = (event) => {
                        this.db = event.target.result;
                        this.isAvailable = true;
                        log("IndexedDB initialized successfully");
                    };
                } catch (err) {
                    warn("IndexedDB initialization error:", err);
                    this.isAvailable = false;
                }
            }

            async saveFailedUpload(blob, metadata) {
                if (!this.isAvailable || !this.db) {
                    warn("IndexedDB not available - cannot persist failed upload");
                    return null;
                }

                try {
                    // Convert blob to ArrayBuffer for storage
                    const arrayBuffer = await blob.arrayBuffer();

                    const record = {
                        blobData: arrayBuffer,
                        blobType: blob.type,
                        metadata: metadata,
                        timestamp: Date.now(),
                        retryCount: 0,
                        lastError: null,
                        status: 'pending'
                    };

                    return new Promise((resolve, reject) => {
                        const transaction = this.db.transaction([this.storeName], 'readwrite');
                        const store = transaction.objectStore(this.storeName);
                        const request = store.add(record);

                        request.onsuccess = () => {
                            log(`Saved failed upload to IndexedDB (id=${request.result})`);
                            this._checkQuota();
                            resolve(request.result);
                        };

                        request.onerror = (event) => {
                            error("Failed to save upload to IndexedDB:", event.target.error);
                            reject(event.target.error);
                        };
                    });
                } catch (err) {
                    error("Error saving failed upload:", err);
                    return null;
                }
            }

            async getPendingUploads() {
                if (!this.isAvailable || !this.db) return [];

                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction([this.storeName], 'readonly');
                    const store = transaction.objectStore(this.storeName);
                    const index = store.index('status');
                    const request = index.getAll('pending');

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = (event) => {
                        error("Failed to get pending uploads:", event.target.error);
                        resolve([]);
                    };
                });
            }

            async updateUploadStatus(id, status, lastError = null) {
                if (!this.isAvailable || !this.db) return false;

                return new Promise((resolve) => {
                    const transaction = this.db.transaction([this.storeName], 'readwrite');
                    const store = transaction.objectStore(this.storeName);
                    const request = store.get(id);

                    request.onsuccess = () => {
                        const record = request.result;
                        if (record) {
                            record.status = status;
                            record.retryCount++;
                            record.lastError = lastError;
                            store.put(record);
                            resolve(true);
                        } else {
                            resolve(false);
                        }
                    };

                    request.onerror = () => resolve(false);
                });
            }

            async deleteUpload(id) {
                if (!this.isAvailable || !this.db) return false;

                return new Promise((resolve) => {
                    const transaction = this.db.transaction([this.storeName], 'readwrite');
                    const store = transaction.objectStore(this.storeName);
                    const request = store.delete(id);

                    request.onsuccess = () => {
                        log(`Deleted upload from IndexedDB (id=${id})`);
                        resolve(true);
                    };
                    request.onerror = () => resolve(false);
                });
            }

            async _checkQuota() {
                if (!this.isAvailable || !this.db) return;

                const pending = await this.getPendingUploads();
                let totalSize = 0;

                for (const record of pending) {
                    totalSize += record.blobData?.byteLength || 0;
                }

                const sizeMB = totalSize / (1024 * 1024);

                if (sizeMB > this.maxStorageMB) {
                    warn(`IndexedDB quota exceeded (${sizeMB.toFixed(2)}MB > ${this.maxStorageMB}MB)`);

                    // Remove oldest abandoned entries first
                    const abandoned = pending.filter(r => r.status === 'abandoned').sort((a, b) => a.timestamp - b.timestamp);
                    for (const record of abandoned) {
                        if (sizeMB <= this.maxStorageMB * 0.8) break;
                        await this.deleteUpload(record.id);
                        log(`Removed abandoned upload to free quota (id=${record.id})`);
                    }
                }
            }

            startRetryWorker(uploadFunction) {
                if (this._retryWorker) return;

                log("Starting IndexedDB retry worker");

                this._retryWorker = setInterval(async () => {
                    if (!this.isAvailable) return;

                    const pending = await this.getPendingUploads();

                    for (const record of pending) {
                        if (record.retryCount >= this.maxRetries) {
                            warn(`Upload exceeded max retries (id=${record.id}), marking as abandoned`);
                            await this.updateUploadStatus(record.id, 'abandoned');
                            continue;
                        }

                        try {
                            // Reconstruct blob from stored data
                            const blob = new Blob([record.blobData], { type: record.blobType });

                            log(`Retrying failed upload (id=${record.id}, attempt=${record.retryCount + 1})`);
                            await uploadFunction(blob, record.metadata);

                            // Success - delete from IndexedDB
                            await this.deleteUpload(record.id);
                            log(`IndexedDB retry successful (id=${record.id})`);

                        } catch (err) {
                            error(`IndexedDB retry failed (id=${record.id}):`, err);
                            await this.updateUploadStatus(record.id, 'pending', err.message);
                        }
                    }
                }, this.retryIntervalMs);
            }

            stopRetryWorker() {
                if (this._retryWorker) {
                    clearInterval(this._retryWorker);
                    this._retryWorker = null;
                    log("IndexedDB retry worker stopped");
                }
            }

            async getMetrics() {
                if (!this.isAvailable || !this.db) return { available: false };

                const pending = await this.getPendingUploads();
                let totalSize = 0;

                for (const record of pending) {
                    totalSize += record.blobData?.byteLength || 0;
                }

                return {
                    available: true,
                    pendingCount: pending.length,
                    totalSizeMB: (totalSize / (1024 * 1024)).toFixed(2),
                    maxStorageMB: this.maxStorageMB
                };
            }
        }

        // Global persistence instance
        const uploadPersistence = new HPEUploadPersistence();
        window.HPEUploadPersistence = uploadPersistence;

        /**
         * SlidingVideoBuffer - Maintains a rolling 20-second video buffer
         * for violation evidence capture.
         */
        class SlidingVideoBuffer {
            constructor(maxDurationSeconds = 20, chunkIntervalMs = 1000) {
                this.maxDuration = maxDurationSeconds * 1000;
                this.chunkInterval = chunkIntervalMs;
                this.chunks = [];
                this.mediaRecorder = null;
                this.isRecording = false;
                this._restarting = false;
                this._cleanupInterval = null;
                this._lastCodec = null;
                this._uploadTriggered = false;

                // Periodic recorder reset to prevent memory leaks
                this._resetInterval = null;
                this._resetIntervalMs = 30 * 60 * 1000; // 30 minutes
                this._lastResetTime = Date.now();
                this._currentStream = null;
                this._currentCallback = null;

                // Sliding window improvements
                this.maxChunks = 50;  // Hard limit regardless of timing
                this._restartDelay = 200;  // Increased from 100ms

                // WebM initialization chunk - CRITICAL for playable videos
                // The first chunk after each recorder start contains EBML header
                this._initChunk = null;

                // Health metrics for monitoring
                this._metrics = {
                    chunksDropped: 0,
                    uploadAttempts: 0,
                    uploadSuccesses: 0,
                    uploadFailures: 0,
                    errorsRecovered: 0,
                    bufferOverflows: 0
                };

                log(
                    `Buffer initialized - Max: ${maxDurationSeconds}s, Interval: ${chunkIntervalMs}ms, MaxChunks: ${this.maxChunks}`
                );
            }

            /**
             * Initialize the MediaRecorder with the provided stream
             */
            initializeRecorder(stream, onViolationCallback) {
                this._currentStream = stream;
                this._currentCallback = onViolationCallback;
                this._createRecorder();
                this._setupPeriodicReset();
                log("MediaRecorder initialized successfully (VIDEO ONLY)");
            }

            /**
             * Create/recreate the MediaRecorder instance
             */
            _createRecorder() {
                // Clean up existing recorder if any
                if (this.mediaRecorder) {
                    try {
                        if (this.mediaRecorder.state === "recording") {
                            this.mediaRecorder.stop();
                        }
                    } catch (err) {
                        warn("Error stopping old recorder:", err);
                    }
                    this.mediaRecorder = null;
                }

                // Reset init chunk - new recorder will generate new WebM header
                this._initChunk = null;

                // Create video-only stream (NO AUDIO)
                const videoOnlyStream = new MediaStream(
                    this._currentStream.getVideoTracks()
                );

                const options = {
                    mimeType: this.getSupportedMimeType(),
                    videoBitsPerSecond: 1000000,
                };

                log("Creating MediaRecorder (VIDEO ONLY - NO AUDIO)");
                log(`Video tracks: ${videoOnlyStream.getVideoTracks().length}`);
                log(`Audio tracks: ${videoOnlyStream.getAudioTracks().length}`);
                log(`Requested MIME type: "${options.mimeType}"`);

                this.mediaRecorder = new MediaRecorder(videoOnlyStream, options);

                // Reset codec tracking
                this._requestedCodec = options.mimeType;
                this._lastCodec = null;

                this.mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        // Capture first chunk as initialization chunk (contains EBML header)
                        // This is CRITICAL for creating playable WebM files
                        if (!this._initChunk) {
                            this._initChunk = event.data;
                            log(`📦 Captured initialization chunk: ${(event.data.size / 1024).toFixed(1)}KB (contains WebM header)`);
                        }

                        // Set actual codec from first chunk
                        if (!this._lastCodec) {
                            this._lastCodec = event.data.type;
                            log(`Actual codec (from first chunk): "${this._lastCodec}"`);

                            const normalize = (str) => str.replace(/\s+/g, "").toLowerCase();
                            if (normalize(this._requestedCodec) !== normalize(this._lastCodec)) {
                                log(`ℹ️ Browser normalized codec string:`);
                                log(`  Requested: "${this._requestedCodec}"`);
                                log(`  Actual:    "${this._lastCodec}"`);
                            }
                        }

                        // Check for REAL codec changes
                        if (this._lastCodec && event.data.type !== this._lastCodec) {
                            warn(`⚠️ REAL CODEC CHANGE DETECTED:`);
                            warn(`  Previous: "${this._lastCodec}"`);
                            warn(`  Current:  "${event.data.type}"`);
                            this._lastCodec = event.data.type;
                        }

                        this.addChunk({
                            data: event.data,
                            timestamp: Date.now(),
                            size: event.data.size,
                        });
                    }
                };

                this.mediaRecorder.onstop = async () => {
                    log("MediaRecorder stopped");

                    if (this._restarting) {
                        warn("Restarting, skipping onstop upload logic");
                        return;
                    }

                    // Only upload if triggered by violation, not by periodic reset
                    if (this._uploadTriggered && this._currentCallback) {
                        this._uploadTriggered = false; // Reset flag
                        this._metrics.uploadAttempts++;

                        // Get buffer duration BEFORE creating blob (uses chunk timestamps)
                        const actualDurationMs = this.getBufferDuration();
                        let videoBlob = this.createVideoBlob();

                        if (videoBlob.size === 0) {
                            warn("Empty blob created, skipping upload");
                            this.clearBuffer();
                        } else {
                            // CRITICAL: Fix WebM duration metadata before upload
                            // Without this, videos appear as 1 second instead of actual duration
                            if (actualDurationMs > 0) {
                                videoBlob = await fixWebmDuration(videoBlob, actualDurationMs);
                            }

                            log(
                                `Created violation blob: ${(videoBlob.size / 1024 / 1024).toFixed(2)}MB from ${this.chunks.length} chunks`
                            );

                            // Upload with the blob - returns true if upload or IndexedDB save succeeded
                            const success = await this._currentCallback(videoBlob);

                            // Only clear buffer if upload/IndexedDB save confirmed
                            if (success !== false) {
                                const chunksCleared = this.chunks.length;
                                this.clearBuffer();
                                this._metrics.uploadSuccesses++;
                                log(`Upload complete - cleared ${chunksCleared} chunks`);
                            } else {
                                this._metrics.uploadFailures++;
                                warn("Upload failed and IndexedDB unavailable - retaining buffer");
                            }
                        }
                    }

                    // Restart recording with fresh buffer
                    if (this.isRecording) {
                        this._restarting = true;
                        setTimeout(() => {
                            if (
                                this.isRecording &&
                                this.mediaRecorder &&
                                this.mediaRecorder.state === "inactive"
                            ) {
                                try {
                                    this.mediaRecorder.start(this.chunkInterval);
                                    log("Recording restarted");
                                } catch (err) {
                                    error("Failed to restart recording:", err);
                                }
                            }
                            this._restarting = false;
                        }, this._restartDelay);  // Use configurable delay
                    }
                };

                this.mediaRecorder.onerror = (event) => {
                    error("MediaRecorder error:", event.error);
                    this._handleRecorderError();
                };
            }

            _setupPeriodicReset() {
                // Clear existing timer
                if (this._resetInterval) {
                    clearInterval(this._resetInterval);
                }

                this._resetInterval = setInterval(() => {
                    if (this.isRecording && !this._restarting) {
                        log("🔄 Proactive recorder reset (30min maintenance)");
                        this._performPeriodicReset();
                    }
                }, this._resetIntervalMs);

                log(`Periodic reset scheduled every ${this._resetIntervalMs / 60000} minutes`);
            }

            /**
             * Perform periodic reset without losing data
             */
            async _performPeriodicReset() {
                if (this._restarting) {
                    warn("Reset already in progress");
                    return;
                }

                this._restarting = true;

                try {
                    log("🔄 Starting periodic recorder reset...");

                    // Stop current recorder
                    if (this.mediaRecorder && this.mediaRecorder.state === "recording") {
                        this.mediaRecorder.stop();
                    }

                    // Wait for stop to complete
                    await new Promise((resolve) => setTimeout(resolve, 500));

                    log(`Buffer preserved: ${this.chunks.length} chunks retained`);
                    log("Recreating MediaRecorder instance...");

                    // Recreate recorder with same stream
                    this._createRecorder();

                    // Restart recording
                    if (this.isRecording) {
                        this.mediaRecorder.start(this.chunkInterval);
                        this._lastResetTime = Date.now();
                        log("✅ Periodic reset complete - recording resumed with buffer intact");
                    }
                } catch (err) {
                    error("Error during periodic reset:", err);
                    this._handleRecorderError();
                } finally {
                    this._restarting = false;
                }
            }

            async _handleRecorderError() {
                error("Attempting error recovery...");

                await new Promise((resolve) => setTimeout(resolve, 1000));

                try {
                    log(`Preserving buffer during recovery: ${this.chunks.length} chunks`);
                    log("Recreating recorder after error...");
                    this._createRecorder();

                    if (this.isRecording) {
                        this.mediaRecorder.start(this.chunkInterval);
                        log("✅ Error recovery successful - buffer preserved");
                    }
                } catch (err) {
                    error("❌ Error recovery failed:", err);
                    log("⚠️ Fatal error - clearing buffer");
                    this.clearBuffer();
                }
            }

            getSupportedMimeType() {
                const types = [
                    "video/webm; codecs=vp9",
                    "video/webm; codecs=vp8",
                    "video/webm",
                    "video/mp4",
                ];

                for (const type of types) {
                    if (MediaRecorder.isTypeSupported(type)) {
                        log(`Using MIME type: ${type}`);
                        return type;
                    }
                }

                log("Using fallback MIME type: video/webm");
                return "video/webm";
            }

            addChunk(chunkInfo) {
                this.chunks.push(chunkInfo);
                this.maintainSlidingWindow();

                if (DEBUG && this.chunks.length % 5 === 0) {
                    const totalSize = this.chunks.reduce(
                        (sum, chunk) => sum + chunk.size,
                        0
                    );
                    const duration = this.getBufferDuration();
                    const timeSinceReset = (
                        (Date.now() - this._lastResetTime) / 60000
                    ).toFixed(1);
                    log(
                        `Status: ${this.chunks.length} chunks, ` +
                        `${(totalSize / 1024 / 1024).toFixed(2)}MB, ` +
                        `${(duration / 1000).toFixed(1)}s | ` +
                        `Uptime: ${timeSinceReset}min`
                    );
                }
            }

            maintainSlidingWindow() {
                const now = Date.now();
                const cutoffTime = now - this.maxDuration;

                let removedCount = 0;

                // Remove chunks older than maxDuration
                while (
                    this.chunks.length > 0 &&
                    this.chunks[0].timestamp < cutoffTime
                ) {
                    const removedChunk = this.chunks.shift();
                    if (removedChunk.data) {
                        removedChunk.data = null;
                    }
                    removedCount++;
                    this._metrics.chunksDropped++;
                }

                if (removedCount > 0) {
                    log(`Removed ${removedCount} old chunks from buffer`);
                }

                // Hard limit: never exceed maxChunks (emergency cap)
                if (this.chunks.length > this.maxChunks) {
                    const overflow = this.chunks.length - this.maxChunks;
                    this._metrics.bufferOverflows++;
                    warn(`Buffer overflow! Dropping ${overflow} chunks to enforce ${this.maxChunks} limit`);

                    while (this.chunks.length > this.maxChunks) {
                        const removedChunk = this.chunks.shift();
                        if (removedChunk.data) {
                            removedChunk.data = null;
                        }
                        this._metrics.chunksDropped++;
                    }
                }
            }

            clearBuffer() {
                const count = this.chunks.length;

                this.chunks.forEach((chunk) => {
                    if (chunk.data) {
                        chunk.data = null;
                    }
                });

                this.chunks = [];
                log(`Buffer cleared - removed ${count} chunks`);
            }

            getBufferDuration() {
                if (this.chunks.length < 2) return 0;
                return (
                    this.chunks[this.chunks.length - 1].timestamp -
                    this.chunks[0].timestamp
                );
            }

            createVideoBlob() {
                if (this.chunks.length === 0) {
                    warn("No chunks available for blob creation");
                    return new Blob([], { type: "video/webm" });
                }

                const dataChunks = this.chunks
                    .map((chunk) => chunk.data)
                    .filter((data) => data && data.size > 0);

                if (dataChunks.length === 0) {
                    warn("No valid data chunks");
                    return new Blob([], { type: "video/webm" });
                }

                const types = new Set(dataChunks.map((chunk) => chunk.type));
                if (types.size > 1) {
                    warn("Multiple codecs detected:", Array.from(types));
                }

                const mimeType = this._initChunk?.type || dataChunks[0].type || "video/webm;codecs=vp9";

                // CRITICAL: Check if we need to prepend the initialization chunk
                // WebM files require the EBML header/segment info from the first chunk
                let finalChunks = dataChunks;

                if (this._initChunk) {
                    // Check if the first data chunk is different from init chunk
                    // (meaning the original first chunk was evicted by sliding window)
                    const firstChunkIsDifferent = dataChunks.length > 0 &&
                        dataChunks[0] !== this._initChunk &&
                        dataChunks[0].size !== this._initChunk.size;

                    if (firstChunkIsDifferent) {
                        // Prepend the init chunk to ensure valid WebM structure
                        finalChunks = [this._initChunk, ...dataChunks];
                        log(`📦 Prepended init chunk (${(this._initChunk.size / 1024).toFixed(1)}KB) for valid WebM header`);
                    }
                } else {
                    warn("⚠️ No initialization chunk available - video may be corrupted");
                }

                const blob = new Blob(finalChunks, { type: mimeType });

                log(
                    `Created blob from ${finalChunks.length} chunks (${dataChunks.length} data + ${finalChunks.length > dataChunks.length ? 1 : 0} init), ` +
                    `size: ${(blob.size / 1024 / 1024).toFixed(2)}MB, ` +
                    `duration: ${(this.getBufferDuration() / 1000).toFixed(1)}s, ` +
                    `type: ${mimeType}`
                );

                return blob;
            }

            startRecording() {
                if (!this.mediaRecorder) {
                    throw new Error("MediaRecorder not initialized. Call initializeRecorder() first.");
                }

                if (this.mediaRecorder.state === "recording") {
                    log("Already recording");
                    return;
                }

                this.isRecording = true;
                this._lastResetTime = Date.now();
                this.mediaRecorder.start(this.chunkInterval);

                // Start periodic cleanup
                this._cleanupInterval = setInterval(() => {
                    this.maintainSlidingWindow();
                }, 10000);

                log(`Started recording with ${this.chunkInterval}ms chunk intervals`);
            }

            stopRecording() {
                this.isRecording = false;

                if (this._cleanupInterval) {
                    clearInterval(this._cleanupInterval);
                    this._cleanupInterval = null;
                }

                if (this._resetInterval) {
                    clearInterval(this._resetInterval);
                    this._resetInterval = null;
                }

                if (this.mediaRecorder && this.mediaRecorder.state === "recording") {
                    this.mediaRecorder.stop();
                    log("Stopped recording");
                }
            }

            triggerViolationUpload() {
                if (!this.mediaRecorder || this.mediaRecorder.state !== "recording") {
                    warn("Cannot trigger upload - not recording");
                    return false;
                }

                if (this._restarting) {
                    warn("Reset in progress, skipping upload trigger");
                    return false;
                }

                this._uploadTriggered = true;
                log("Triggering violation upload - stopping recorder");
                this.mediaRecorder.stop();
                return true;
            }

            getBufferInfo() {
                const totalSize = this.chunks.reduce(
                    (sum, chunk) => sum + chunk.size,
                    0
                );
                const duration = this.getBufferDuration();
                const uptimeMinutes = (
                    (Date.now() - this._lastResetTime) / 60000
                ).toFixed(1);

                return {
                    chunkCount: this.chunks.length,
                    totalSizeBytes: totalSize,
                    totalSizeMB: (totalSize / 1024 / 1024).toFixed(2),
                    durationMs: duration,
                    durationSeconds: (duration / 1000).toFixed(1),
                    isRecording: this.isRecording,
                    recorderState: this.mediaRecorder?.state || "uninitialized",
                    maxDurationSeconds: this.maxDuration / 1000,
                    chunkIntervalMs: this.chunkInterval,
                    uptimeMinutes: parseFloat(uptimeMinutes),
                    nextResetIn: this._resetIntervalMs - (Date.now() - this._lastResetTime),
                    codecConsistency:
                        this.chunks.length > 0
                            ? new Set(this.chunks.filter(c => c.data).map(c => c.data.type)).size <= 1
                            : true,
                };
            }

            /**
             * Get health metrics for monitoring and debugging
             */
            getHealthMetrics() {
                return {
                    ...this._metrics,
                    currentChunkCount: this.chunks.length,
                    maxChunks: this.maxChunks,
                    bufferUtilization: ((this.chunks.length / this.maxChunks) * 100).toFixed(1) + '%',
                    bufferHealthy: this.chunks.length < this.maxChunks * 0.8,
                    isRecording: this.isRecording,
                    uptimeMinutes: ((Date.now() - this._lastResetTime) / 60000).toFixed(1)
                };
            }

            cleanup() {
                log("Starting cleanup");

                this.stopRecording();

                this.chunks.forEach((chunk) => {
                    if (chunk.data) {
                        chunk.data = null;
                    }
                });
                this.chunks = [];

                if (this._cleanupInterval) {
                    clearInterval(this._cleanupInterval);
                    this._cleanupInterval = null;
                }

                if (this._resetInterval) {
                    clearInterval(this._resetInterval);
                    this._resetInterval = null;
                }

                this.mediaRecorder = null;
                this._currentStream = null;
                this._currentCallback = null;

                log("Cleanup completed");
            }
        }

        /**
         * HPEProctoringVideoManager - High-level manager for proctoring video
         */
        class HPEProctoringVideoManager {
            constructor(videoElement, statusElement, config = {}) {
                this.video = videoElement;
                this.status = statusElement;

                this.apiBaseUrl =
                    config.apiBaseUrl ||
                    document.querySelector('meta[name="proctoring-api"]')?.content ||
                    "http://127.0.0.1:8001";

                this.uploadTimeout = config.uploadTimeout || 30000; // 30s default
                this.maxRetries = config.maxRetries || 2;
                this.retryDelay = config.retryDelay || 2000;

                this.buffer = new SlidingVideoBuffer(
                    config.bufferDuration || 20,
                    config.chunkInterval || 1000
                );

                this.isUploading = false;
                this._uploadAbortController = null;

                log("Manager initialized with config:", {
                    apiBaseUrl: this.apiBaseUrl,
                    uploadTimeout: this.uploadTimeout,
                    maxRetries: this.maxRetries,
                });
            }

            async initialize(mediaStream, userData = {}) {
                this.userData = userData;
                this.buffer.initializeRecorder(
                    mediaStream,
                    this.handleViolationUpload.bind(this)
                );
                this.buffer.startRecording();

                if (this.status) {
                    this.status.textContent = "Video buffer initialized - recording started";
                }

                // Phase 5: Start IndexedDB retry worker
                if (uploadPersistence.isAvailable) {
                    uploadPersistence.startRetryWorker(this._retryUpload.bind(this));
                }

                log("Video buffer system initialized");
            }

            // Phase 5: Retry upload function for IndexedDB worker
            async _retryUpload(videoBlob, metadata) {
                const formData = new FormData();
                formData.append("file", videoBlob, `violation_${Date.now()}.webm`);
                formData.append("dmoj_user_id", parseInt(metadata.userId || 0));
                formData.append("dmoj_user_name", String(metadata.username || ""));
                formData.append("dmoj_contest_name", String(metadata.contestName || ""));
                formData.append("timestamp", metadata.timestamp || new Date().toISOString());
                formData.append("source", "indexeddb_retry");  // Mark as retry

                const response = await fetch(this.apiBaseUrl + "/upload-clip", {
                    method: "POST",
                    body: formData,
                    headers: { "ngrok-skip-browser-warning": "true" }
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                return await response.json();
            }

            async handleViolationUpload(videoBlob) {
                // Prevent concurrent uploads
                if (this.isUploading) {
                    log("Upload already in progress, skipping");
                    return true;  // Don't clear buffer in this case
                }

                this.isUploading = true;

                if (this.status) {
                    this.status.textContent = "Violation detected - uploading evidence...";
                }

                let lastError = null;

                // Retry logic
                for (let attempt = 1; attempt <= this.maxRetries; attempt++) {
                    try {
                        log(`Upload attempt ${attempt}/${this.maxRetries}`);
                        await this._uploadWithTimeout(videoBlob);

                        // Success!
                        log("Upload successful");
                        if (this.status) {
                            this.status.textContent = "Evidence uploaded successfully";
                        }

                        this.isUploading = false;
                        this._scheduleStatusReset();
                        return true;  // Success - safe to clear buffer
                    } catch (err) {
                        lastError = err;
                        error(`Upload attempt ${attempt} failed:`, err);

                        if (attempt < this.maxRetries) {
                            log(`Retrying in ${this.retryDelay}ms...`);
                            await new Promise((resolve) =>
                                setTimeout(resolve, this.retryDelay)
                            );
                        }
                    }
                }

                // All retries failed
                error("All upload attempts failed:", lastError);
                if (this.status) {
                    this.status.textContent = "Failed to upload evidence - saving locally";
                }

                // Phase 5: Persist to IndexedDB for background retry
                let savedToIndexedDB = false;
                if (uploadPersistence.isAvailable) {
                    const metadata = {
                        userId: this.userData?.userId || window.dmojData?.userId,
                        username: this.userData?.username || window.dmojData?.username,
                        contestName: this.userData?.contestName || window.dmojData?.contestName,
                        timestamp: new Date().toISOString(),
                        lastError: lastError?.message
                    };

                    const saveResult = await uploadPersistence.saveFailedUpload(videoBlob, metadata);
                    savedToIndexedDB = saveResult !== null;

                    if (savedToIndexedDB) {
                        log("Failed upload saved to IndexedDB for later retry");
                        if (this.status) {
                            this.status.textContent = "Evidence saved locally - will retry automatically";
                        }
                    }
                }

                this.isUploading = false;
                this._scheduleStatusReset();

                // Return true if saved to IndexedDB (safe to clear buffer), false otherwise
                return savedToIndexedDB;
            }

            async _uploadWithTimeout(videoBlob) {
                const formData = new FormData();
                formData.append("file", videoBlob, `violation_${Date.now()}.webm`);

                // Ensure proper data types
                const userId = parseInt(
                    this.userData?.userId || window.dmojData?.userId || 0
                );
                const username = String(
                    this.userData?.username || window.dmojData?.username || ""
                );
                const contestName = String(
                    this.userData?.contestName || window.dmojData?.contestName || ""
                );

                formData.append("dmoj_user_id", userId);
                formData.append("dmoj_user_name", username);
                formData.append("dmoj_contest_name", contestName);
                formData.append("timestamp", new Date().toISOString());

                log(
                    `Uploading - Size: ${(videoBlob.size / 1024 / 1024).toFixed(2)}MB, User: ${userId}`
                );

                // Setup abort controller for timeout
                this._uploadAbortController = new AbortController();
                const timeoutId = setTimeout(() => {
                    this._uploadAbortController.abort();
                }, this.uploadTimeout);

                try {
                    const response = await fetch(this.apiBaseUrl + "/upload-clip", {
                        method: "POST",
                        body: formData,
                        signal: this._uploadAbortController.signal,
                        headers: {
                            "ngrok-skip-browser-warning": "true",
                        },
                    });

                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }

                    const result = await response.json();
                    log("Upload response:", result);
                    return result;
                } catch (err) {
                    clearTimeout(timeoutId);

                    if (err.name === "AbortError") {
                        throw new Error(`Upload timeout after ${this.uploadTimeout}ms`);
                    }
                    throw err;
                } finally {
                    this._uploadAbortController = null;
                }
            }

            _scheduleStatusReset() {
                setTimeout(() => {
                    if (!this.isUploading && this.status) {
                        this.status.textContent = "Monitoring active";
                    }
                }, 3000);
            }

            triggerViolationUpload() {
                return this.buffer.triggerViolationUpload();
            }

            getStatus() {
                return {
                    ...this.buffer.getBufferInfo(),
                    isUploading: this.isUploading,
                    apiBaseUrl: this.apiBaseUrl,
                    uploadTimeout: this.uploadTimeout,
                    maxRetries: this.maxRetries,
                };
            }

            cancelUpload() {
                if (this._uploadAbortController) {
                    log("Cancelling ongoing upload");
                    this._uploadAbortController.abort();
                }
            }

            cleanup() {
                log("Cleaning up video manager");
                this.cancelUpload();
                this.buffer.cleanup();

                // Phase 5: Stop IndexedDB retry worker
                uploadPersistence.stopRetryWorker();
            }
        }

        window.HPEProctoringVideoManager = HPEProctoringVideoManager;
        window.HPESlidingVideoBuffer = SlidingVideoBuffer;

        log("Module ready - Classes exported:");
        log("  - window.HPEProctoringVideoManager");
        log("  - window.HPESlidingVideoBuffer");
    })();
</script>
