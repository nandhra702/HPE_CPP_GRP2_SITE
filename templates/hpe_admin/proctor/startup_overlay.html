<style>
    #startup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #1e1e1e;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-family: 'Segoe UI', sans-serif;
    }

    .startup-card {
        background: #252526;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        max-width: 500px;
        width: 90%;
        text-align: center;
        border: 1px solid #404040;
    }

    .startup-title {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 30px;
        color: var(--hpe-green, #01a982);
    }

    .step-box {
        background: #2d2d2d;
        padding: 20px;
        border-radius: 6px;
        margin-bottom: 15px;
        text-align: left;
        border: 1px solid #404040;
        transition: all 0.3s;
        opacity: 0.5;
        pointer-events: none;
    }

    .step-box.active {
        opacity: 1;
        pointer-events: auto;
        border-color: var(--hpe-green, #01a982);
    }

    .step-box.completed {
        opacity: 0.8;
        border-color: #4caf50;
    }

    .step-header {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
        font-weight: 600;
        font-size: 16px;
    }

    .step-icon {
        margin-right: 10px;
        width: 24px;
        text-align: center;
    }

    .action-btn {
        background: var(--hpe-green, #01a982);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        width: 100%;
        transition: background 0.2s;
    }

    .action-btn:hover {
        background: #008f6d;
    }

    .action-btn:disabled {
        background: #404040;
        cursor: not-allowed;
        color: #888;
    }

    .video-preview-box {
        margin-top: 15px;
        background: #000;
        border-radius: 4px;
        overflow: hidden;
        height: 0;
        transition: height 0.3s;
    }

    .video-preview-box.show {
        height: 150px;
    }

    #startup-video-preview {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
</style>

<div id="startup-overlay">
    <div class="startup-card">
        <div class="startup-title">Exam Setup</div>

        <!-- Step 1: Camera -->
        <div id="step-camera" class="step-box active">
            <div class="step-header">
                <span class="step-icon">📷</span>
                <span>Camera Access</span>
            </div>
            <p style="font-size: 13px; color: #ccc; margin-bottom: 15px;">Camera monitoring is required for this exam.
            </p>
            <button id="btn-camera" class="action-btn">Enable Camera</button>
            <div id="camera-preview-container" class="video-preview-box">
                <video id="startup-video-preview" autoplay muted playsinline></video>
            </div>
        </div>

        <!-- Step 2: Fullscreen -->
        <div id="step-fullscreen" class="step-box">
            <div class="step-header">
                <span class="step-icon">⛶</span>
                <span>Fullscreen Mode</span>
            </div>
            <p style="font-size: 13px; color: #ccc; margin-bottom: 15px;">The exam must be taken in fullscreen mode.</p>
            <button id="btn-fullscreen" class="action-btn">Enter Fullscreen</button>
        </div>

        <!-- Step 3: Start -->
        <div id="step-start" class="step-box">
            <div class="step-header">
                <span class="step-icon">🚀</span>
                <span>Ready to Start</span>
            </div>
            <button id="btn-start-exam" class="action-btn">Start Exam</button>
        </div>
    </div>
</div>

<script>
    (function () {
        let mediaStream = null;

        const els = {
            stepCamera: document.getElementById('step-camera'),
            stepFullscreen: document.getElementById('step-fullscreen'),
            stepStart: document.getElementById('step-start'),
            btnCamera: document.getElementById('btn-camera'),
            btnFullscreen: document.getElementById('btn-fullscreen'),
            btnStart: document.getElementById('btn-start-exam'),
            videoPreview: document.getElementById('startup-video-preview'),
            videoContainer: document.getElementById('camera-preview-container')
        };

        // Helper to transition steps
        function activateStep(stepEl) {
            stepEl.classList.remove('active', 'completed');
            stepEl.classList.add('active');
        }

        function completeStep(stepEl) {
            stepEl.classList.remove('active');
            stepEl.classList.add('completed');
        }

        // Camera Handlers
        els.btnCamera.addEventListener('click', async () => {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                els.videoPreview.srcObject = mediaStream;
                els.videoContainer.classList.add('show');

                els.btnCamera.textContent = "Camera Enabled ✓";
                els.btnCamera.disabled = true;

                completeStep(els.stepCamera);
                activateStep(els.stepFullscreen);
            } catch (e) {
                alert("Camera access failed: " + e.message);
            }
        });

        // Fullscreen Handlers
        els.btnFullscreen.addEventListener('click', async () => {
            try {
                await document.documentElement.requestFullscreen();
                els.btnFullscreen.textContent = "Fullscreen Enabled ✓";
                els.btnFullscreen.disabled = true;

                completeStep(els.stepFullscreen);
                activateStep(els.stepStart);
            } catch (e) {
                alert("Fullscreen failed: " + e.message);
            }
        });

        // Start Handler
        els.btnStart.addEventListener('click', () => {
            if (window.handleProctoringStart && mediaStream) {
                window.handleProctoringStart({
                    stream: mediaStream
                });
            }
        });

    })();
</script>
